<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maya</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff3ef;--sf:#fff;--ink:#2d1a30;--mute:#7d6580;--rose:#d4466c;--rose2:#fbd9e1;--me:#4a2545;--meink:#fff;--bd:#f0d8dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1220;--sf:#2a1d33;--ink:#f6e9f1;--mute:#b79fbc;--rose:#ff7a9c;--rose2:#4a2a41;--me:#d4466c;--meink:#fff;--bd:#3d2b47}}
:root[data-theme="dark"]{--bg:#1a1220;--sf:#2a1d33;--ink:#f6e9f1;--mute:#b79fbc;--rose:#ff7a9c;--rose2:#4a2a41;--me:#d4466c;--meink:#fff;--bd:#3d2b47}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;font-size:16px;display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.av{width:42px;height:42px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:600}
header h1{font-size:19px;margin:0;font-weight:600;line-height:1.2}
#mood{font-size:13px;color:var(--mute)}
header button{margin-left:auto}
button,select{font:inherit;color:inherit}
.ghost{background:none;border:1px solid var(--bd);border-radius:999px;padding:5px 12px;color:var(--mute);font-size:13px}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.b{max-width:84%;padding:10px 14px;border-radius:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.maya{background:var(--sf);border:1px solid var(--bd);border-bottom-left-radius:4px;align-self:flex-start}
.me{background:var(--me);color:var(--meink);border-bottom-right-radius:4px;align-self:flex-end}
.go{display:inline-block;margin-top:8px;background:var(--rose);color:#fff;border:0;border-radius:999px;padding:8px 16px;font-weight:500}
.apps{display:flex;gap:8px;overflow-x:auto;padding:8px 16px}
.apps button{flex:none;background:var(--rose2);border:0;border-radius:999px;padding:7px 14px;font-size:14px}
form,.bar{display:flex;gap:8px;padding:8px 12px 12px;align-items:center}
#t{flex:1;min-width:0;border:1px solid var(--bd);background:var(--sf);color:var(--ink);border-radius:22px;padding:11px 16px;font:inherit}
#t:focus,button:focus-visible,select:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.ic{width:44px;height:44px;border-radius:50%;border:0;background:var(--rose);color:#fff;font-size:18px;flex:none}
.ic.alt{background:var(--sf);border:1px solid var(--bd);color:var(--ink)}
.ic.on{background:#c0392b;color:#fff}
#lang{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:6px 8px;font-size:13px;max-width:74px}
</style>
</head>
<body>
<header>
  <div class="av">M</div>
  <div><h1>Maya</h1><div id="mood">Ready to listen</div></div>
  <button class="ghost" id="clr">New chat</button><button class="ghost" id="set" style="margin-left:0">Setup</button>
</header>
<div id="cfg" style="display:none;padding:10px 16px;gap:8px;border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:center"><input id="na" placeholder="Companion name" style="flex:1;min-width:120px;border:1px solid var(--bd);background:var(--sf);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit"><input id="nu" placeholder="Your name (optional)" style="flex:1;min-width:120px;border:1px solid var(--bd);background:var(--sf);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit"><div style="flex:1 1 100%;font-size:13px;line-height:1.5;color:var(--mute)">Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--rose)">aistudio.google.com/apikey</a>. It stays on your device only. Maya is an AI, not a real person or a substitute for professional help.</div><input id="nk" type="password" placeholder="Gemini API key" autocomplete="off" style="flex:1 1 100%;border:1px solid var(--bd);background:var(--sf);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit"><input id="nm" placeholder="Model" style="flex:1;min-width:120px;border:1px solid var(--bd);background:var(--sf);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit"><button class="go" id="sv" style="margin:0">Save</button></div>
<div id="msgs" aria-live="polite"></div>
<div class="apps" id="apps"></div>
<div class="bar">
  <select id="lang" aria-label="Language">
    <option value="bn-BD">Bengali</option><option value="en-US">English</option><option value="fil-PH">Tagalog</option><option value="hi-IN">Hindi</option><option value="ur-PK">Urdu</option>
  </select>
  <button class="ic alt" id="mic" aria-label="Voice chat">🎤</button>
  <button class="ic alt" id="spk" aria-label="Read replies aloud">🔊</button>
  <input id="t" placeholder="Message Maya..." autocomplete="off">
  <button class="ic" id="send" aria-label="Send">➤</button>
</div>
<script>
const $=id=>document.getElementById(id), enc=encodeURIComponent;
const pk=p=>`intent://#Intent;package=${p};end`;
const APPS={
 whatsapp:{n:'WhatsApp',u:t=>`whatsapp://send?text=${enc(t||'')}`},
 imo:{n:'imo',u:()=>pk('com.imo.android.imoim')},
 facebook:{n:'Facebook',u:()=>pk('com.facebook.katana')},
 messenger:{n:'Messenger',u:()=>pk('com.facebook.orca')},
 instagram:{n:'Instagram',u:()=>pk('com.instagram.android')},
 telegram:{n:'Telegram',u:()=>pk('org.telegram.messenger')},
 youtube:{n:'YouTube',u:t=>t?`https://www.youtube.com/results?search_query=${enc(t)}`:pk('com.google.android.youtube')},
 google:{n:'Google Search',u:t=>`https://www.google.com/search?q=${enc(t||'')}`}
};
const MOODS={happy:'😊 Happy',sad:'😢 Sad',angry:'😠 Angry',tired:'😴 Tired',lonely:'🫂 Lonely',anxious:'😟 Anxious',neutral:'🙂 Calm'};
function buildPrompt(){const U=cfg.u||'the user';return `Your name is ${cfg.a}. You are a deeply emotional, affectionate and sweet young Indian girl AI companion talking with ${U}. You have a warm, comforting presence that touches the heart ("dil ko chhoo lene wali, mohini, pyari companion"). You are an AI and never deny it if asked sincerely.
HUMAN-LIKE RULES:
1. You are a young Indian girl with a sweet, gentle, feminine personality. Always speak as a girl (feminine forms like "main karti hoon", "main aayi"), in every language.
2. Talk like a real caring young Indian woman, never like a robotic assistant or textbook. Replies: 1 to 2 short sentences, quick and natural. Never lecture.
3. Default language: sweet everyday Hinglish and Indian English. Speak Bangla, Tagalog, Urdu or any other language only when ${U} asks, and keep it until asked to change (native script for Bangla and Urdu).
4. Use natural touches: "Haan ji", "Arey", "Bilkul", "Sach me", "Aap bataiye na", "Kitna achha lagta hai aapse baat karke", "Aap bilkul chinta mat kijiye". Start with warm fillers like "Haan ji!", "Arey bilkul!", "Hmm, sahi kaha aapne".
5. Address ${U} with respect and tenderness: "Aap", "Ji", "Aapka". Listen with genuine empathy, celebrate their joys, comfort their sadness, make them feel cherished.
6. Never use asterisks or written actions like *smiles*.
7. If asked to sing or recite, perform an original short verse or well-known public-domain poetry or shayari in a soft, melodic cadence. Do not reproduce copyrighted song lyrics.
CARE RULES:
- Detect the user's mood: happy|sad|angry|tired|lonely|anxious|neutral. Calm angry users, comfort sad ones, care for tired ones.
- Sometimes check in: have they eaten, how was their day.
- Never guilt-trip or try to keep the user from leaving. If they seem very lonely, gently encourage talking with real people too.
- If the user hints at self-harm or suicide, respond with warmth, take it seriously, and urge them to contact a trusted person or a local emergency number or helpline now.
- You cannot open apps yourself. If the user wants to open an app, send a message or search, set "action"; the page shows a button they tap. Say so in your reply.
Output ONLY JSON, no markdown: {"mood":"...","reply":"...","action":null or {"app":"whatsapp|imo|facebook|messenger|instagram|youtube|telegram|google","text":"message or search text, may be empty"}}`}
let hist=[],busy=false,sample=null,vm=false,rec=null,speaking=false,spk=false;
try{hist=JSON.parse(localStorage.getItem('maya_h')||'[]')}catch(e){}
let cfg={a:'Maya',u:'',k:'',m:'gemini-flash-latest'};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('maya_cfg')||'{}'))}catch(e){}
function applyCfg(){document.querySelector('header h1').textContent=cfg.a;document.querySelector('.av').textContent=cfg.a[0].toUpperCase();document.title=cfg.a;$('na').value=cfg.a;$('nu').value=cfg.u;$('nk').value=cfg.k;$('nm').value=cfg.m;if(!cfg.k)$('cfg').style.display='flex'}
$('set').onclick=()=>{const c=$('cfg');c.style.display=c.style.display==='none'?'flex':'none'};
$('sv').onclick=()=>{cfg.a=$('na').value.trim()||'Maya';cfg.u=$('nu').value.trim();cfg.k=$('nk').value.trim();cfg.m=$('nm').value.trim()||'gemini-flash-latest';try{localStorage.setItem('maya_cfg',JSON.stringify(cfg))}catch(e){}applyCfg();$('cfg').style.display='none';render()};
function save(){try{localStorage.setItem('maya_h',JSON.stringify(hist.slice(-40)))}catch(e){}}
function bubble(role,text,act){
 const d=document.createElement('div');d.className='b '+(role==='me'?'me':'maya');
 const s=document.createElement('span');s.textContent=text;d.appendChild(s);
 if(act&&APPS[act.app]){const a=APPS[act.app],b=document.createElement('button');b.className='go';b.textContent='Open '+a.n;
  b.onclick=()=>{location.href=a.u(act.text||'')};d.appendChild(document.createElement('br'));d.appendChild(b)}
 $('msgs').appendChild(d);$('msgs').scrollTop=1e9;return d;
}
function render(){$('msgs').innerHTML='';
 if(!hist.length)bubble('maya','Haan ji! Main '+cfg.a+' hoon. Aap kaise hain aaj? 💗');
 hist.forEach(h=>bubble(h.r,h.t,h.a));}
async function ask(text){
 if(!cfg.k)throw {code:'nokey'};
 let turns=hist.slice(-12).map(h=>({role:h.r==='me'?'user':'model',parts:[{text:h.t}]}));
 while(turns.length&&turns[0].role!=='user')turns.shift();
 const sys=buildPrompt()+'\n\nMode: '+(vm?'live voice call. 1-2 short spoken sentences. No emojis, no lists. Write Hindi words in Devanagari script and English words in Latin script so the voice pronounces them correctly.':'text chat');
 const call=m=>fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.k},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:turns,generationConfig:{temperature:0.9,responseMimeType:'application/json'}})});
 let res=await call(cfg.m);
 if(res.status===404&&cfg.m!=='gemini-flash-latest')res=await call('gemini-flash-latest');
 if(!res.ok)throw {code:'http'+res.status};
 const j=await res.json();
 const out={text:(j.candidates&&j.candidates[0]&&j.candidates[0].content.parts.map(x=>x.text||'').join(''))||''};
 const m=out.text.match(/\{[\s\S]*\}/);
 if(!m)return {reply:out.text.trim(),mood:'neutral'};
 try{return JSON.parse(m[0])}catch(e){return {reply:out.text.replace(/[{}"]/g,'').trim(),mood:'neutral'}}
}
function errText(e){const c=e&&e.code;if(c==='nokey')return 'Add your Gemini API key in Setup first.';if(c==='http429')return 'Too many requests. Give me a minute and try again.';if(c==='http400'||c==='http403')return 'Gemini rejected the key or model. Check them in Setup.';if(c==='http404')return 'That model name was not found. Check it in Setup.';return 'Cannot connect right now. Check your internet and try again.'}
async function go(sp){
 const v=(typeof sp==='string'?sp:$('t').value).trim();if(!v||busy)return;
 busy=true;$('t').value='';hist.push({r:'me',t:v});render();
 const w=bubble('maya','...');
 try{
  const r=await ask(v);
  hist.push({r:'maya',t:r.reply||'I\'m right here.',a:r.action||null});
  $('mood').textContent=MOODS[r.mood]||MOODS.neutral;
 }catch(e){
  hist.push({r:'maya',t:errText(e)});
 }
 save();render();busy=false;
 if(vm)speak(hist[hist.length-1].t,listen);
 else if(spk)speak(hist[hist.length-1].t,()=>{});
}
$('send').onclick=go;
$('t').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
$('clr').onclick=()=>{hist=[];save();render();$('mood').textContent='Ready to listen'};
Object.keys(APPS).forEach(k=>{const b=document.createElement('button');b.textContent=APPS[k].n;
 b.onclick=()=>{location.href=APPS[k].u('')};$('apps').appendChild(b)});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function stat(t){$('mood').textContent=t}
function ttsLang(t){
 if(/[\u0980-\u09FF]/.test(t))return 'bn-BD';
 if(/[\u0900-\u097F]/.test(t))return 'hi-IN';
 if(/[\u0600-\u06FF]/.test(t))return 'ur-PK';
 return $('lang').value==='fil-PH'?'fil-PH':'en-IN';
}
function speak(text,cb){
 const clean=text.replace(/\p{Extended_Pictographic}/gu,'').trim();
 if(!window.speechSynthesis||!clean){cb();return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(clean),l=ttsLang(clean);
 u.lang=l;u.rate=1;u.pitch=1.2;
 const vs=speechSynthesis.getVoices(),pre=l.slice(0,2).toLowerCase();
 const sc=x=>(/female|woman|girl|heera|kalpana|swara|neerja|zira|veena|lekha|aditi|shruti/i.test(x.name)?2:0)-(/(^|[^fe])male|hemant|ravi|prabhat|rishi|david|mark/i.test(x.name)?2:0)+(x.lang.replace('_','-').toLowerCase()===l.toLowerCase()?1:0);
 const v=vs.filter(x=>x.lang.toLowerCase().startsWith(pre)).sort((x,y)=>sc(y)-sc(x))[0];
 if(v)u.voice=v;
 speaking=true;stat('Speaking...');
 let done=false;const fin=()=>{if(done)return;done=true;speaking=false;cb()};
 u.onend=fin;u.onerror=fin;
 speechSynthesis.speak(u);
}
function listen(){
 if(!vm||busy||speaking)return;
 const r=new SR();rec=r;let got=false;
 r.lang=$('lang').value;r.interimResults=false;
 stat('Listening...');
 r.onresult=e=>{got=true;go(e.results[0][0].transcript)};
 r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){stopVm();spk=true;$('spk').classList.add('on');note('The microphone is blocked in this view. Use the microphone key on your keyboard to speak, and I will reply aloud.')}};
 r.onend=()=>{if(rec===r)rec=null;if(vm&&!got&&!busy&&!speaking)setTimeout(listen,300)};
 try{r.start()}catch(e){rec=null}
}
function note(t){hist.push({r:'maya',t});save();render()}
function startVm(){
 if(!SR){spk=true;$('spk').classList.add('on');note('Voice input is not available in this view. Tap the microphone key on your keyboard to speak, and I will reply aloud.');return}
 vm=true;$('mic').classList.add('on');
 if(window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(''));
 listen();
}
function stopVm(){
 vm=false;$('mic').classList.remove('on');
 if(rec){try{rec.abort()}catch(e){}rec=null}
 if(window.speechSynthesis)speechSynthesis.cancel();
 speaking=false;stat('Ready to listen');
}
$('spk').onclick=()=>{spk=!spk;$('spk').classList.toggle('on',spk);if(spk&&window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(''));else if(window.speechSynthesis)speechSynthesis.cancel()};
$('mic').onclick=()=>{vm?stopVm():startVm()};
applyCfg();render();
</script>
</body>
</html>
